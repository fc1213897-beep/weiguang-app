# 微光 · Nginx 反代示例（正式版小程序须 HTTPS 443，无端口）
# 用法见 docs/服务器部署指南.md「HTTPS 与合法域名」

server {
    listen 80;
    server_name www.weiguanglife.top weiguanglife.top;
    return 301 https://www.weiguanglife.top$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.weiguanglife.top;

    # certbot 证书路径（按实际域名修改）
    ssl_certificate     /etc/letsencrypt/live/www.weiguanglife.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.weiguanglife.top/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
